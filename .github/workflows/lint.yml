name: Lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  stylelint:
    name: Stylelint (CSS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install stylelint stylelint-config-standard

      - uses: reviewdog/action-stylelint@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-pr-review
          stylelint_input: "skin_data/style.css"

  htmlhint:
    name: HTMLHint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install HTMLHint
        run: npm install -g htmlhint

      - uses: reviewdog/action-setup@v1
        with:
          reviewdog_version: latest

      - name: Run HTMLHint with reviewdog
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          htmlhint skin_data/*.html --format checkstyle | reviewdog -f=checkstyle -reporter=github-pr-review
